name: Pipeline credential diagnosis

on:
  push:
    branches: [diagnose/pipeline-auth-20260909]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-auth-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare stored PAT and built-in token without exposing credentials
        env:
          PIPELINE_PAT: ${{ secrets.PIPELINE_PAT }}
          RUNNER_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import {appendFileSync} from 'node:fs';
          const repo = 'eckelt/deskleaf-for-obsidian';
          let failed = false;
          for (const name of ['PIPELINE_PAT', 'RUNNER_TOKEN']) {
            const token = process.env[name];
            const result = {credential: name, present: Boolean(token)};
            if (token) {
              for (const [key, path] of [['repository', ''], ['contents', '/git/ref/heads/main']]) {
                try {
                  const response = await fetch(`https://api.github.com/repos/${repo}${path}`, {
                    headers: {Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json'},
                    signal: AbortSignal.timeout(15000),
                  });
                  result[key] = response.status;
                  await response.body?.cancel();
                } catch { result[key] = 'network-error'; }
              }
              const env = {...process.env, GIT_TERMINAL_PROMPT: '0', GIT_CONFIG_COUNT: '1',
                GIT_CONFIG_KEY_0: 'http.https://github.com/.extraheader',
                GIT_CONFIG_VALUE_0: `AUTHORIZATION: basic ${Buffer.from(`x-access-token:${token}`).toString('base64')}`};
              const git = spawnSync('git', ['ls-remote', `https://github.com/${repo}.git`, 'HEAD'],
                {env, stdio: 'ignore', timeout: 30000});
              result.gitExit = git.status;
            }
            const ok = result.repository === 200 && result.contents === 200 && result.gitExit === 0;
            failed ||= !ok;
            console.log(JSON.stringify(result));
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- ${name}: present=${result.present}, repository=${result.repository ?? 'not-tested'}, contents=${result.contents ?? 'not-tested'}, gitExit=${result.gitExit ?? 'not-tested'}\n`);
          }
          process.exitCode = failed ? 1 : 0;
          NODE
