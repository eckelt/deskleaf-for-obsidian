name: Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-ts:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build-swift:
    name: Swift Tests & Build
    runs-on: macos-15
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@v5
      - run: swift test
      - run: |
          swift build -c release --arch arm64 --arch x86_64
          cp .build/apple/Products/Release/DeskleafCalendarSync ../deskleaf-calendar-sync
          chmod +x ../deskleaf-calendar-sync
          codesign --force --sign - ../deskleaf-calendar-sync
      - uses: actions/upload-artifact@v7
        with:
          name: deskleaf-calendar-sync
          path: deskleaf-calendar-sync

  release:
    name: Continuous Release
    needs: [test-ts, build-swift]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v7
        with:
          name: deskleaf-calendar-sync
      - run: chmod +x deskleaf-calendar-sync
      # BRAT needs a strictly increasing version in manifest.json that matches
      # the release tag. Patch level = run number, so every merge to main
      # becomes an installable pre-release; stable releases stay manual.
      - name: Stamp build version
        id: version
        run: |
          base=$(jq -r '.version' manifest.json | cut -d. -f1,2)
          version="${base}.${{ github.run_number }}"
          jq --arg v "$version" '.version = $v' manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Package plugin
        run: bash scripts/package-release.sh
      - name: Publish versioned release (BRAT)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Deskleaf ${{ steps.version.outputs.version }}
          prerelease: true
          make_latest: false
          body: |
            Automatically built from `main` — commit ${{ github.sha }}
            Installable via BRAT (see README → Installation).
          files: |
            main.js
            styles.css
            manifest.json
            deskleaf-calendar-sync
            deskleaf-for-obsidian.zip
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          make_latest: false
          body: |
            Automatically built from `main` — commit ${{ github.sha }}
          files: |
            main.js
            styles.css
            manifest.json
            deskleaf-calendar-sync
            install.sh
            deskleaf-for-obsidian.zip
