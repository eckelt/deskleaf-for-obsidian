name: Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-ts:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build-swift:
    name: Swift Tests & Build
    runs-on: macos-15
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: |
          swift build -c release --arch arm64 --arch x86_64
          cp .build/apple/Products/Release/DeskleafCalendarSync ../deskleaf-calendar-sync
          chmod +x ../deskleaf-calendar-sync
          codesign --force --sign - ../deskleaf-calendar-sync
      - uses: actions/upload-artifact@v4
        with:
          name: deskleaf-calendar-sync
          path: deskleaf-calendar-sync

  release:
    name: Continuous Release
    needs: [test-ts, build-swift]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          name: deskleaf-calendar-sync
      - run: chmod +x deskleaf-calendar-sync
      - name: Package plugin
        run: zip -r deskleaf-for-obsidian.zip main.js styles.css manifest.json deskleaf-calendar-sync
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          make_latest: false
          body: |
            Automatically built from `main` — commit ${{ github.sha }}
          files: |
            main.js
            styles.css
            manifest.json
            deskleaf-calendar-sync
            deskleaf-for-obsidian.zip
