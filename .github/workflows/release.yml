name: Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-ts:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build-swift:
    name: Swift Tests & Build
    runs-on: macos-15
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@v5
      - run: swift test
      - run: |
          swift build -c release --arch arm64 --arch x86_64
          cp .build/apple/Products/Release/DeskleafCalendarSync ../deskleaf-calendar-sync
          chmod +x ../deskleaf-calendar-sync
          codesign --force --sign - ../deskleaf-calendar-sync
      - uses: actions/upload-artifact@v7
        with:
          name: deskleaf-calendar-sync
          path: deskleaf-calendar-sync

  release:
    name: Continuous Release
    needs: [test-ts, build-swift]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Stamped into main.js at build time via esbuild's `define` (see
      # esbuild.config.mjs) so the running plugin can show it without any
      # extra file — BRAT only delivers main.js, styles.css and manifest.json.
      - name: Set release date
        run: echo "DESKLEAF_RELEASE_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - run: npm run build
      - uses: actions/download-artifact@v7
        with:
          name: deskleaf-calendar-sync
      - run: chmod +x deskleaf-calendar-sync
      # BRAT needs a strictly increasing version in manifest.json that matches
      # the release tag. Patch level increments off the last ACTUALLY
      # PUBLISHED release (source of truth = GitHub Releases), not off
      # github.run_number: a workflow re-registration or any other run_number
      # discontinuity previously produced a version that BRAT-installed users
      # got permanently stuck behind (e.g. 1.3.6 outliving every subsequent
      # 1.2.x release). Only resets to .0 when manifest.json's own committed
      # major.minor is deliberately bumped ahead of the latest release's.
      - name: Stamp build version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          committed_base=$(jq -r '.version' manifest.json | cut -d. -f1,2)
          latest_tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty' --repo "${{ github.repository }}")
          latest_base=""
          latest_patch=0
          if [[ -n "$latest_tag" ]]; then
            latest_base=$(echo "$latest_tag" | cut -d. -f1,2)
            latest_patch=$(echo "$latest_tag" | cut -d. -f3)
          fi
          if [[ "$committed_base" == "$latest_base" ]]; then
            version="${committed_base}.$(( latest_patch + 1 ))"
          else
            version="${committed_base}.0"
          fi
          jq --arg v "$version" '.version = $v' manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Package plugin
        run: bash scripts/package-release.sh
      - name: Publish versioned release (BRAT)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Deskleaf ${{ steps.version.outputs.version }}
          prerelease: true
          make_latest: false
          body: |
            Automatically built from `main` — commit ${{ github.sha }}
            Installable via BRAT (see README → Installation).
          files: |
            main.js
            styles.css
            manifest.json
            deskleaf-calendar-sync
            deskleaf-for-obsidian.zip
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          make_latest: false
          body: |
            Automatically built from `main` — commit ${{ github.sha }}
          files: |
            main.js
            styles.css
            manifest.json
            deskleaf-calendar-sync
            install.sh
            deskleaf-for-obsidian.zip
