name: Mutation Testing

# Nightly mutation-testing health check (issue #58) for the pure utility
# modules configured in stryker.config.mjs. Fully decoupled from the build
# lane: its own trigger set and concurrency group, never dispatched by or
# dispatching build-lane.yml, and not a required status check on any PR — a
# red or slow run here cannot block a merge. Visibility is the Job Summary
# alone (no break threshold, no issue comment, no other reporting channel).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: mutation-testing
  cancel-in-progress: false

jobs:
  mutation-test:
    name: Run mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run mutation tests
        run: npm run test:mutation
      - name: Write mutation summary
        if: always()
        run: node scripts/mutation-summary.mjs
