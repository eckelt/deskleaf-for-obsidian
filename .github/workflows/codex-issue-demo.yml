name: Codex Issue Demo

on:
  issues:
    types: [opened, edited, reopened, labeled]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPENAI_MODEL: ${{ vars.CODEX_DEMO_MODEL || 'gpt-5.5' }}

jobs:
  respond:
    name: Comment on labeled issues
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'codex-demo')
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate issue response
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/codex-issue-demo.mjs
      - name: Comment on issue
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("node:fs");
            const body = fs.readFileSync("codex-issue-demo-comment.md", "utf8");
            const marker = "<!-- codex-demo-response -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previousComment = comments.find((comment) => comment.body.includes(marker));

            if (previousComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previousComment.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
