name: Code Quality Baseline

# Nightly code-smell baseline (issue #71) via eslint-plugin-sonarjs against
# src/**/*.ts. Fully decoupled from the build lane: its own trigger set and
# concurrency group, never dispatched by or dispatching build-lane.yml or
# mutation-testing.yml, and not a required status check on any PR — a red or
# noisy run here cannot block a merge. All sonarjs rules run at "warn"
# severity (see eslint.config.mjs), so `npm run lint:quality` always exits 0.
# Visibility is the Job Summary alone (no break threshold, no issue comment,
# no other reporting channel).

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

concurrency:
  group: code-quality-baseline
  cancel-in-progress: false

jobs:
  quality-baseline:
    name: Run code quality baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run sonarjs code quality baseline
        run: npm run lint:quality
      - name: Write code quality summary
        if: always()
        run: npm run quality:summary
