name: Code Quality Baseline

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

concurrency:
  group: code-quality-baseline
  cancel-in-progress: false

jobs:
  code-quality:
    name: Run code quality baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run ESLint quality baseline
        run: npm run lint:quality
      - name: Write quality summary
        if: always()
        run: npm run quality:summary
